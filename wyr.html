/* ===== Visual refresh (styling only; layout and behaviour unchanged) ===== */
:root{
  --bg:#f3f7fb; --surface:#ffffff; --surface-2:#edf4fa; --line:#dde8f1;
  --display:"Montserrat","Open Sans",system-ui,sans-serif; --body:"Poppins","Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --grad:linear-gradient(135deg,#0b5394 0%,#11679f 55%,#1a98cb 100%);

  --sh-3:0 18px 40px -12px rgba(11,83,148,.35);
  --sh-go:0 8px 18px -8px rgba(11,83,148,.7);

  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08121f; --surface:#101e31; --surface-2:#172a43; --line:#22395a;

:root[data-theme="dark"]{

/* Header bar */
header{background:var(--grad);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 6px 20px -10px rgba(11,83,148,.6);position:relative;z-index:2}
header h1{letter-spacing:-.02em}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;

/* Surfaces */
.card{border-color:var(--line);border-radius:18px;box-shadow:var(--sh-2)}

.sub{line-height:1.5}

/* Buttons */
.btn{border-radius:14px;letter-spacing:.005em;box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .12s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease),background-color .2s var(--ease)}

/* Forms */

/* Setup screens */
.setup h2{letter-spacing:-.025em}
.pl{border-radius:12px}
.ivy a{text-decoration:none;border-bottom:1.5px solid currentColor}
/* ===== end visual refresh ===== */
</style>

const SETS = {everyone:"Everyone", grownup:"Grown-up twist"};
const ROUNDS = [1, 2, 3];

let G = null, menuOpen = false, rulesOpen = false, setupPlayers = null, opts = {turns:2, set:"everyone"};
let talk = true, used = [];

/* ---------- Voice and saving ---------- */
const TTS = typeof speechSynthesis !== "undefined"; let voice = null;
function pickVoice(){ if(!TTS) return; const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^en[-_]US/i.test(v.lang) && /natural|enhanced|premium|online/i.test(v.name)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if(TTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t){ if(!TTS || !talk || typeof SpeechSynthesisUtterance === "undefined") return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); if(voice){ u.voice = voice; u.lang = voice.lang; } u.rate = 1; speechSynthesis.speak(u); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({G, talk, opts, used})); }catch(e){} }
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d){ talk = d.talk !== false; if(d.opts) opts = Object.assign(opts, d.opts); if(Array.isArray(d.used)) used = d.used; if(d.G && d.G.v === 1) G = d.G; } }catch(e){} }
function rallyPlayers(){
  try{ const d = JSON.parse(localStorage.getItem(RALLY_KEY)); if(d && d.players && d.players.length) return d.players.map(p => ({id:p.id, name:p.name})); }catch(e){}
  if(!PUBLIC) return [["mom","Mom"],["dad","Dad"],["kippi","Kippi"],["zubbu","Zubbu"]].map(([id, name]) => ({id, name}));
  return [1,2].map(i => ({id:"p" + i, name:"Player " + i}));
}
function sendToRally(){
  try{ const d = JSON.parse(localStorage.getItem(RALLY_KEY)); if(!d || !d.players || G.players.length < 2) return false;
    const pts = [25, 10], got = [];
    ranking().slice(0, 2).forEach((pi, k) => { const id = G.players[pi].id; if(!d.players.some(p => p.id === id)) return;
      d.today = d.today || {}; d.today[id] = (d.today[id] || 0) + pts[k]; d.log = d.log || []; d.log.push({id, pts:pts[k], label:"Would You Rather place " + (k + 1)}); got.push(G.players[pi].name + " +" + pts[k]); });
    if(!got.length) return false;
    localStorage.setItem(RALLY_KEY, JSON.stringify(d)); G.got = got; return true; }catch(e){ return false; }
}

/* ---------- Game state ---------- */
function drawQuestion(){
  const set = G.set, list = BANK[set];
  let free = list.map((_, i) => set + i).filter(id => !used.includes(id)), wrap = false;
  if(!free.length){ wrap = true; used = used.filter(id => !id.startsWith(set)); free = list.map((_, i) => set + i); toast("All questions used. Starting the question bank again."); }
  const id = free[Math.floor(Math.random() * free.length)], [a, b] = list[+id.slice(set.length)].split("|");
  used.push(id); G.q = {id, a, b}; G.guess = {}; G.secret = null; G.phase = "secret"; return wrap;
}
function newGame(players){
  G = {v:1, players:players.map(p => ({id:p.id, name:p.name})), rounds:players.length * (opts.turns || 2), turns:opts.turns || 2, set:opts.set, round:0,
    score:players.map(() => 0), right:players.map(() => 0), q:null, guess:{}, last:null, phase:"guess", sent:false, tried:false};
  drawQuestion();
}
const HOT = () => G.round % G.players.length;
const guessers = () => G.players.map((_, i) => i).filter(i => i !== HOT());
function ranking(){ return G.players.map((_, i) => i).sort((a, b) => G.score[b] - G.score[a] || G.right[b] - G.right[a] || a - b); }
const qText = q => "Would you rather " + q.a + ", or " + q.b + "?";
function readQuestion(){ const h = G.players[HOT()].name; say(h + " is in the hot seat. " + qText(G.q) + (G.phase === "secret" ? " Pass the phone to " + h + " to pick secretly." : "")); }
const nameList = arr => arr.length < 2 ? arr.join("") : arr.slice(0, -1).join(", ") + " and " + arr[arr.length - 1];

function reveal(pick){
  const hot = HOT(), rows = [], rightN = [], wrongN = [];
  guessers().forEach(i => { const ok = G.guess[i] === pick; if(ok){ G.score[i] += 10; G.right[i]++; rightN.push(G.players[i].name); } else wrongN.push(G.players[i].name);
    rows.push({i, g:G.guess[i], ok}); });
  const bonus = wrongN.length * 5; G.score[hot] += bonus;
  G.last = {pick, rows, bonus, hot}; G.phase = "result";
  const hn = G.players[hot].name, opt = pick === "A" ? G.q.a : G.q.b;
  let t = hn + " would rather " + opt + ". ";
  if(rightN.length) t += nameList(rightN) + (rightN.length === 1 ? " got it right, plus 10. " : " got it right, plus 10 each. ");
  else t += "Nobody guessed it! ";
  if(bonus) t += hn + " gets " + bonus + " for surprising " + nameList(wrongN) + ".";
  else t += "Everyone knew " + hn + " well!";
  say(t);
}
function nextRound(){
  G.round++;
  if(G.round >= G.rounds){ G.phase = "over"; const r = ranking(); say(G.players[r[0]].name + " wins with " + G.score[r[0]] + " points!"); return; }
  drawQuestion(); readQuestion();
}

/* ---------- Screens ---------- */
const RULES = `<div class="card"><h3>How to play</h3>
  <ul class="sub" style="margin:0;padding-left:1.1em;color:var(--ink);display:flex;flex-direction:column;gap:6px">
    <li>One player sits in the <b>hot seat</b>. The phone reads out a question: would you rather A or B?</li>
    <li>First, pass the phone to the hot-seat player, who <b>taps their answer secretly</b>. It stays hidden.</li>
    <li>Pass the phone back. Everyone else guesses out loud; the phone holder taps A or B next to each name.</li>
    <li>Tap <b>Reveal</b> to show the hot-seat player's locked answer.</li>
    <li>Right guess: <b>+10</b>. The hot-seat player gets <b>+5</b> for every wrong guess, so surprise them!</li>
    <li>The hot seat moves on each round. Most points wins; if level, more right guesses wins.</li>
  </ul></div>`;
function setupScreen(){
  if(!setupPlayers){ setupPlayers = rallyPlayers().map((p, i) => ({...p, on:i < 6})); }
  const n = setupPlayers.filter(p => p.on).length;
  return `<div class="setup"><h2>Would You Rather</h2><p class="sub">The front passenger holds the phone and taps for everyone. Guess what the hot-seat player will choose.</p>
    <div class="card"><h3>Who's playing? (2 to 6)</h3>${setupPlayers.map((p, i) => `<label class="pl"><input type="checkbox" class="pon" data-i="${i}" ${p.on ? "checked" : ""} ${!p.on && n >= 6 ? "disabled" : ""}><span>${esc(p.name)}</span></label>`).join("")}</div>
    <div class="card"><div class="prow"><h3>Hot seat turns each</h3><div class="seg">${ROUNDS.map(o => `<button class="${(opts.turns || 2) === o ? "on" : ""}" data-a="rnd" data-v="${o}">${o}</button>`).join("")}</div></div>
      <div class="prow"><h3>Questions</h3><div class="seg">${Object.entries(SETS).map(([k, v]) => `<button class="${opts.set === k ? "on" : ""}" data-a="set" data-v="${k}">${v}</button>`).join("")}</div></div>
      <p class="sub">${opts.set === "everyone" ? "Fun questions for all ages." : "Still family-safe, a little more to think about."}</p></div>
    <button class="btn go big" data-a="start" ${n >= 2 && n <= 6 ? "" : "disabled"}>${n >= 2 ? `Start: ${n} players` : "Tick at least 2 players"}</button>
    ${G && G.phase !== "over" ? `<button class="btn" data-a="resume">Back to the current game</button>` : ""}
    ${RULES}<p class="ivy">Made with AI by Ivy Professional School. <a href="https://ivyproschool.com/" target="_blank" rel="noopener">ivyproschool.com</a></p></div>`;
}
function optCard(L, text, mode){
  const cls = "opt " + L.toLowerCase();
  if(mode === "tap") return `<button class="${cls} pick" data-a="pick" data-v="${L}"><span class="L">${L}</span><span>${esc(text)}</span></button>`;
  return `<div class="${cls} ${mode || ""}"><span class="L">${L}</span><span>${esc(text)}</span></div>`;
}
function minis(){ return `<div class="minis">${G.players.map((p, i) => `<span>${esc(p.name)} <b>${G.score[i]}</b></span>`).join("")}</div>`; }
function questionCol(mode){
  const hot = G.players[HOT()].name, q = G.q, res = G.phase === "result";
  const doing = G.phase === "secret" ? "Pass the phone to " + esc(hot) + ". " + esc(hot) + ": tap your answer secretly. No peeking, everyone else!"
    : G.phase === "guess" ? esc(hot) + " has locked in an answer. Everyone else: guess out loud what " + esc(hot) + " picked."
    : G.phase === "answer" ? esc(hot) + ": say your real answer. Tap it below."
    : esc(hot) + " picked " + G.last.pick + ". See who guessed right.";
  return `<div class="col">
    <div class="meta"><span>Round ${G.round + 1} of ${G.rounds}</span><span>${SETS[G.set]}</span></div>
    <div class="card turn"><p class="hot">${esc(hot)} is in the hot seat</p><p class="doing">${doing}</p>
      ${G.phase === "guess" || G.phase === "secret" ? `<button class="rbtn" data-a="read">Read it again</button>` : ""}</div>
    <p class="q">Would you rather...</p>
    <div class="opts">${optCard("A", q.a, mode === "tap" ? "tap" : res ? (G.last.pick === "A" ? "won" : "lost") : "")}${optCard("B", q.b, mode === "tap" ? "tap" : res ? (G.last.pick === "B" ? "won" : "lost") : "")}</div>
  </div>`;
}
function guessScreen(){
  const gs = guessers(), all = gs.every(i => G.guess[i]);
  const rows = gs.map(i => `<div class="grow"><span class="nm">${esc(G.players[i].name)}</span>${["A", "B"].map(L => `<button class="gb ${L.toLowerCase()} ${G.guess[i] === L ? "on" : ""}" data-a="guess" data-i="${i}" data-v="${L}" aria-pressed="${G.guess[i] === L}" aria-label="${esc(G.players[i].name)} guesses ${L}">${L}<small>${esc(L === "A" ? G.q.a : G.q.b)}</small></button>`).join("")}</div>`).join("");
  return `<div class="wrap"><div class="play">${questionCol("show")}
    <div class="col"><div class="card"><h3>Tap each guess</h3><div class="guesses">${rows}</div></div>
      <button class="btn go big" data-a="toAnswer" ${all ? "" : "disabled"}>${all ? "All guesses in. Reveal " + esc(G.players[HOT()].name) + "'s answer" : "Waiting for " + (gs.length - gs.filter(i => G.guess[i]).length) + " more " + (gs.length - gs.filter(i => G.guess[i]).length === 1 ? "guess" : "guesses")}</button>
      <button class="btn ghost" data-a="skip">Skip this question</button>${minis()}</div></div></div>`;
}
/* The hot-seat player picks in secret before anyone guesses, so the answer cannot change later */
function secretScreen(){
  const hot = esc(G.players[HOT()].name);
  return `<div class="wrap"><div class="play">${questionCol("tap")}
    <div class="col"><div class="card"><h3>Only ${hot} looks now</h3><p class="sub" style="color:var(--ink)">${hot}, tap A or B above. Nobody else will see your answer until the reveal.</p></div>
      <button class="btn ghost" data-a="skip">Skip this question</button>${minis()}</div></div></div>`;
}
function lockedScreen(){
  const hot = esc(G.players[HOT()].name);
  return `<div class="setup"><div class="card turn"><p class="hot">Locked in!</p><p class="doing">${hot}'s answer is saved and hidden. Pass the phone back to the person who taps the guesses.</p></div>
    <button class="btn go big" data-a="toGuess">Start guessing</button></div>`;
}
function answerScreen(){
  const gs = guessers();
  return `<div class="wrap"><div class="play">${questionCol("tap")}
    <div class="col"><div class="card"><h3>The guesses</h3>${gs.map(i => `<div class="srow"><span>${esc(G.players[i].name)}</span><b>${G.guess[i]}</b></div>`).join("")}</div>
      <button class="btn ghost" data-a="back">Change the guesses</button>${minis()}</div></div></div>`;
}
function resultScreen(){
  const L = G.last, hn = esc(G.players[L.hot].name), last = G.round + 1 >= G.rounds, nx = last ? null : G.players[(G.round + 1) % G.players.length].name;
  return `<div class="wrap"><div class="play">${questionCol("result")}
    <div class="col"><div class="card"><h3>Who got it right?</h3>
      ${L.rows.map(r => `<div class="srow"><span>${esc(G.players[r.i].name)} said ${r.g}</span><b class="${r.ok ? "ok" : "no"}">${r.ok ? "Right +10" : "Wrong"}</b></div>`).join("")}
      <div class="srow"><span>${hn} (hot seat)</span><b class="${L.bonus ? "ok" : ""}">${L.bonus ? "+" + L.bonus + " for surprises" : "+0"}</b></div></div>
      <button class="btn go big" data-a="next">${last ? "See the final scores" : "Next round: " + esc(nx) + " in the hot seat"}</button>${minis()}</div></div></div>`;
}
function overScreen(){
  if(!G.sent && !G.tried && G.players.length > 1){ G.tried = true; if(sendToRally()){ G.sent = true; } save(); }
  const r = ranking();
  return `<div class="setup"><div class="card turn"><h2 class="hot" style="font-size:1.9rem">${esc(G.players[r[0]].name)} wins!</h2><p class="doing">${G.rounds} rounds played</p></div>
    <div class="card"><h3>Final scores</h3>${r.map((i, k) => `<div class="srow"><span>${k + 1}. ${esc(G.players[i].name)}</span><b>${G.score[i]} <small class="sub">(${G.right[i]} right)</small></b></div>`).join("")}
      <p class="sub">If points are level, more right guesses ranks higher.</p></div>
    ${G.sent ? `<div class="card target"><b>Added to the scoreboard</b><span class="sub">${esc((G.got || []).join(", "))}</span></div>` : `<button class="btn amber" data-a="rally">Add points to the scoreboard (25 for 1st, 10 for 2nd)</button>`}
    <button class="btn go big" data-a="again">Play again with the same players</button><button class="btn" data-a="menu">Change players</button></div>`;
}
function render(){
  $("#talkBtn").textContent = talk ? "Voice on" : "Voice off";
  const app = $("#app");
  let h;
  if(menuOpen || !G) h = setupScreen();
  else if(G.phase === "secret") h = secretScreen();
  else if(G.phase === "locked") h = lockedScreen();
  else if(G.phase === "guess") h = guessScreen();
  else if(G.phase === "answer") h = answerScreen();
  else if(G.phase === "result") h = resultScreen();
  else h = overScreen();
  app.innerHTML = h + (rulesOpen ? `<div class="rulesbox">${RULES}<button class="btn" data-a="rules">Close the rules</button></div>` : "");
  save();
}
let toastT; function toast(t){ const el = $("#toast"); if(!el) return; el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1900); }

/* ---------- Input ---------- */
if(typeof document !== "undefined" && document.addEventListener){
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if(!b || b.disabled) return;
  let top = false;
  switch(b.dataset.a){
    case "rules": rulesOpen = !rulesOpen; break;
    case "talk": talk = !talk; if(!talk && TTS) speechSynthesis.cancel(); break;
    case "menu": menuOpen = true; setupPlayers = null; rulesOpen = false; top = true; break;
    case "resume": menuOpen = false; top = true; break;
    case "rnd": opts.turns = +b.dataset.v; break;
    case "set": opts.set = b.dataset.v; break;
    case "start": { const ps = setupPlayers.filter(p => p.on); if(ps.length < 2) break; newGame(ps); menuOpen = false; top = true; readQuestion(); break; }
    case "again": { const ps = G.players.map(p => ({...p})); opts.turns = G.turns || 2; opts.set = G.set; newGame(ps); top = true; readQuestion(); break; }
    case "read": readQuestion(); return;
    case "guess": G.guess[+b.dataset.i] = b.dataset.v; break;
    case "skip": if(!drawQuestion()) toast("New question"); readQuestion(); break;
    case "toAnswer": if(G.secret){ reveal(G.secret); top = true; } else { G.phase = "answer"; top = true; } break;
    case "toGuess": G.phase = "guess"; top = true; say("Everyone else, guess what " + G.players[HOT()].name + " picked."); break;
    case "back": G.phase = "guess"; break;
    case "pick": if(G.phase === "secret"){ G.secret = b.dataset.v; G.phase = "locked"; top = true; say("Locked in."); } else { reveal(b.dataset.v); top = true; } break;
    case "next": nextRound(); top = true; break;
    case "rally": if(sendToRally()){ G.sent = true; toast("Points added to the scoreboard"); } else toast("Open the games home screen once on this device first"); break;
    default: return;
  }
  render();
  if(top) window.scrollTo(0, 0);
});
document.addEventListener("change", e => { const t = e.target; if(t.classList.contains("pon")){ setupPlayers[+t.dataset.i].on = t.checked; render(); } });
load(); if(!G || G.phase === "over") menuOpen = true;
render();
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
