<style>
/* Layout: the pitch fills the screen (tap anywhere on it to bat); the score panel sits beside it on tablets and below it on phones. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#eaf4fa; --ink:#14202b; --muted:#526a7d; --line:#d3e3ee;
  --pine:#0b5394; --pine-ink:#ffffff; --sky:#1a98cb; --cap:#f7a61b; --cap-ink:#14202b; --bad:#b0422d; --good:#1d7a4b;
  --red:#d83a3a; --green:#2e9e4f; --yellow:#f2b705; --blue:#1f6fd1;
  --display:"Montserrat","Open Sans",system-ui,sans-serif; --body:"Poppins","Open Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1726; --surface:#12233a; --surface-2:#1a3150; --ink:#eaf2f8; --muted:#9fb4c6; --line:#244263; --pine:#3aaee0; --pine-ink:#04121f; color-scheme:dark; }}
:root[data-theme="dark"]{ --bg:#0b1726; --surface:#12233a; --surface-2:#1a3150; --ink:#eaf2f8; --muted:#9fb4c6; --line:#244263; --pine:#3aaee0; --pine-ink:#04121f; color-scheme:dark; }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:3px solid var(--cap);outline-offset:2px}
[hidden]{display:none!important}
header{background:#0b5394;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;flex:1}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;text-decoration:none;font-size:.88rem}
.hbtn.back{background:#fff;color:#0b5394;font-weight:800}
.logo{background:#fff;border-radius:8px;padding:3px 6px;line-height:0} .logo img{height:28px;width:auto;display:block}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
@media (max-width: 860px){ main{grid-template-columns:1fr} }
#board{width:100%;max-width:min(100%, calc(100vh - 110px));aspect-ratio:1;display:block;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.turn{background:var(--pc);color:#fff;border:0} .turn.light{color:#14202b}
.turn h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;line-height:1.1} .turn p{margin:0}
h3{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0}
.sub{color:var(--muted);margin:0;font-size:.92rem}
.btn{border:0;border-radius:12px;padding:12px 14px;min-height:52px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.go{background:var(--pine);color:var(--pine-ink)} .btn.amber{background:var(--cap);color:var(--cap-ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap} .row .btn{flex:1 1 0}
.dicewrap{display:flex;align-items:center;gap:14px}
.diebtn{border:0;background:none;padding:0;border-radius:18px;flex:none;touch-action:manipulation} .diebtn:disabled{cursor:default}
.rollbtn{min-height:76px;font-size:1.35rem;touch-action:manipulation}
.oneline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rollhit{cursor:pointer}
html{touch-action:manipulation}
.turn p{min-height:2.9em}
.die{width:72px;height:72px;border-radius:16px;background:#fff;border:3px solid #0b5394;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;flex:none}
.die i{width:12px;height:12px;border-radius:50%;background:#14202b;place-self:center;visibility:hidden}
.die.rolling{animation:shake .5s ease}
@keyframes shake{25%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
.seats{display:grid;gap:8px}
.seat{display:flex;align-items:center;gap:10px;font-weight:600}
.seat .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);flex:none}
.seat .home{margin-left:auto;font-family:var(--display);font-weight:800}
.setup{max-width:640px;margin:20px auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup h2{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:0}
.pl{display:flex;align-items:center;gap:10px} .pl input[type=checkbox]{width:28px;height:28px;accent-color:#0b5394}
.ivy{font-size:.85rem;color:var(--muted)} .ivy a{color:var(--pine);font-weight:700}
.tok{cursor:pointer} .tok.can{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-.12px) scale(1.12)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Cricket */
main.play{grid-template-columns:minmax(0,1fr) 330px}
@media (max-width: 860px){ main.play{grid-template-columns:1fr} }
.stage{position:relative;width:100%;height:calc(100vh - 100px);height:calc(100dvh - 100px);min-height:380px;border-radius:20px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;
  box-shadow:0 18px 34px -16px rgba(13,42,64,.45);background:#3f9b4a}
#pitch{display:block;width:100%;height:100%}
.aimbar{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:2}
.aimbar button{min-height:50px;border-radius:14px;border:1.5px solid rgba(255,255,255,.35);background:rgba(6,22,40,.6);color:#fff;font-weight:700;font-size:.92rem;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
.aimbar button.on{background:#fff;color:#0b5394;border-color:#f7a61b;box-shadow:0 0 0 3px rgba(247,166,27,.55)}
.taphint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(6,22,40,.55);color:#fff;font-weight:600;font-size:.82rem;padding:5px 12px;border-radius:999px;pointer-events:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);white-space:nowrap}
@media (max-width: 860px){ .stage{height:auto;aspect-ratio:3/4;max-height:68vh;min-height:0} }
@media (max-width: 860px) and (min-width: 600px){ .stage{aspect-ratio:4/3;max-height:62vh} }
.scoreline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.turn{background:#0b5394;color:#fff}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:1.4rem;opacity:.8}
.target{border:1.5px solid var(--cap)!important;flex-direction:column;gap:2px}
.balls{display:flex;gap:6px;flex-wrap:wrap}
.bl{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.9rem;background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.bl.b{background:var(--grad-amber,#f7a61b);color:#2b1a00;box-shadow:none}
.bl.w{background:#c0392b;color:#fff;box-shadow:none}
.bl.x{font-size:.7rem}
.bl.e{background:transparent;box-shadow:inset 0 0 0 1.5px dashed var(--line);border:1.5px dashed var(--line)}
.srow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.srow:last-child{border-bottom:0}
.srow b{text-align:right}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 12px;font-weight:600;font-size:.85rem;min-height:36px;color:var(--ink)}
.seg button.on{background:var(--grad-go,#0b5394);color:#fff;box-shadow:0 4px 10px -4px rgba(11,83,148,.6)}
.cover{position:fixed;inset:0;z-index:20;background:var(--grad,#0b5394);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.cover h2{font-family:var(--display);font-weight:800;font-size:3.2rem;margin:0;line-height:1;letter-spacing:-.03em}
.rulesbox{position:fixed;inset:auto 0 0 0;z-index:15;max-height:70vh;overflow:auto;background:var(--surface);padding:16px;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}

/* ===== Visual refresh (styling only; layout and behaviour unchanged) ===== */
:root{
  --bg:#f3f7fb; --surface:#ffffff; --surface-2:#edf4fa; --line:#dde8f1;
  --display:"Montserrat","Open Sans",system-ui,sans-serif; --body:"Poppins","Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --grad:linear-gradient(135deg,#0b5394 0%,#11679f 55%,#1a98cb 100%);
  --grad-go:linear-gradient(180deg,#1478b5 0%,#0b5394 100%);
  --grad-amber:linear-gradient(180deg,#ffbd45 0%,#f7a61b 100%);
  --ring:0 0 0 4px rgba(26,152,203,.22);
  --sh-1:0 1px 2px rgba(13,42,64,.05),0 1px 3px rgba(13,42,64,.05);
  --sh-2:0 1px 2px rgba(13,42,64,.04),0 8px 24px -6px rgba(13,42,64,.12);
  --sh-3:0 18px 40px -12px rgba(11,83,148,.35);
  --sh-go:0 8px 18px -8px rgba(11,83,148,.7);
  --sh-amber:0 8px 18px -8px rgba(214,128,0,.75);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08121f; --surface:#101e31; --surface-2:#172a43; --line:#22395a;
  --grad:linear-gradient(135deg,#0a3f73 0%,#0e5a92 60%,#147fb0 100%);
  --grad-go:linear-gradient(180deg,#5cc3ec 0%,#3aaee0 100%);
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6);
  --sh-3:0 18px 40px -14px rgba(0,0,0,.7); --sh-go:0 8px 18px -8px rgba(58,174,224,.55); }}
:root[data-theme="dark"]{
  --bg:#08121f; --surface:#101e31; --surface-2:#172a43; --line:#22395a;
  --grad:linear-gradient(135deg,#0a3f73 0%,#0e5a92 60%,#147fb0 100%);
  --grad-go:linear-gradient(180deg,#5cc3ec 0%,#3aaee0 100%);
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6);
  --sh-3:0 18px 40px -14px rgba(0,0,0,.7); --sh-go:0 8px 18px -8px rgba(58,174,224,.55); }

html{background-color:var(--bg)}
body{background:radial-gradient(900px 420px at 85% -120px,rgba(26,152,203,.12),transparent 70%) no-repeat,var(--bg);min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,h2,h3{letter-spacing:-.015em}
:focus-visible{outline:none;box-shadow:var(--ring),0 0 0 2px var(--sky)!important}

/* Header bar */
header{background:var(--grad);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 6px 20px -10px rgba(11,83,148,.6);position:relative;z-index:2}
header h1{letter-spacing:-.02em}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .18s var(--ease),transform .12s var(--ease)}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn:active{transform:scale(.96)}
.hbtn.back{background:#fff;color:#0b5394;border-color:#fff;box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.hbtn.back:hover{background:#f1f7fc}
.logo{border-radius:10px;box-shadow:0 4px 12px -4px rgba(0,0,0,.3)}

/* Surfaces */
.card{border-color:var(--line);border-radius:18px;box-shadow:var(--sh-2)}
.turn{background-image:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,0) 55%,rgba(0,0,0,.1));box-shadow:var(--sh-3);border-radius:18px}
.sub{line-height:1.5}

/* Buttons */
.btn{border-radius:14px;letter-spacing:.005em;box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .12s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease),background-color .2s var(--ease)}
.btn:hover:not(:disabled){filter:brightness(1.03);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.go{background:var(--grad-go);box-shadow:var(--sh-go)}
.btn.go:hover:not(:disabled){box-shadow:var(--sh-go);filter:brightness(1.07)}
.btn.amber{background:var(--grad-amber);box-shadow:var(--sh-amber),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.amber:hover:not(:disabled){box-shadow:var(--sh-amber),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.bad{box-shadow:none}
.btn:disabled{opacity:.5;filter:saturate(.6)}
.btn.go:disabled,.btn.amber:disabled{box-shadow:none}
.panel{padding-inline:6px;margin-inline:-6px}

/* Forms */
input[type=text],input[type=number],input:not([type]),select{border-radius:12px!important;border-color:var(--line)!important;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input:not([type]):focus,select:focus{outline:none;border-color:var(--sky)!important;box-shadow:var(--ring)}
input[type=checkbox]{accent-color:var(--sky)!important}

/* Toast */
.toast{background:rgba(13,42,64,.92);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 14px 34px -10px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1)}

/* Setup screens */
.setup h2{letter-spacing:-.025em}
.pl{border-radius:12px}
.ivy a{text-decoration:none;border-bottom:1.5px solid currentColor}
/* ===== end visual refresh ===== */
</style>

<body>
<header>
  <a class="hbtn back" href="./" aria-label="Back to all games">‹ Back</a>
  <h1>Cricket</h1>
  <button class="hbtn" data-a="rules">Rules</button>
  <button class="hbtn" id="talkBtn" data-a="talk">Voice on</button>
  <button class="hbtn" data-a="menu">New game</button>
  <a class="logo" href="https://ivyproschool.com/" target="_blank" rel="noopener" aria-label="Ivy Professional School website"><img src="ivy-logo.png" alt="Ivy Professional School"></a>
</header>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- Setup ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PUBLIC = typeof location !== "undefined" && /\/play\//.test(location.pathname);
const RALLY_KEY = PUBLIC ? "ivy-rr-v1" : "himachal-rally-v1", KEY = PUBLIC ? "ivy-cricket-v1" : "family-cricket-v1";
const LEVELS = {easy:{name:"Easy", time:1.9, win:1.9}, medium:{name:"Medium", time:1.4, win:1.35}, hard:{name:"Hard", time:1.05, win:.95}};
/* Three shot directions picked with the buttons on the pitch */
const AIMS = {"-1":-58, "0":0, "1":58};
let aimSel = 0;
/* Timing windows in seconds around the perfect moment (scaled by level) */
const WIN = {perfect:.045, good:.09, ok:.14, edge:.19};
/* Fielders: X metres to the off side (right), Z metres towards the bowler, batter at 0,0 */
/* Three field settings; the captain changes the field every over, so look for the gaps */
const KEEP = [{n:"the keeper", x:0, z:-5}, {n:"slip", x:2.6, z:-6}];
const FIELDS = [
  [{n:"point", x:25, z:3}, {n:"cover", x:21, z:19}, {n:"mid-off", x:9, z:33}, {n:"mid-on", x:-9, z:33}, {n:"mid-wicket", x:-23, z:17}, {n:"square leg", x:-26, z:1}, {n:"fine leg", x:-28, z:-27}, {n:"deep mid-wicket", x:-44, z:42}],
  [{n:"third man", x:30, z:-24}, {n:"deep point", x:52, z:6}, {n:"cover", x:20, z:20}, {n:"long-off", x:16, z:68}, {n:"long-on", x:-16, z:68}, {n:"mid-wicket", x:-22, z:19}, {n:"deep square leg", x:-54, z:4}, {n:"short fine leg", x:-12, z:-12}],
  [{n:"gully", x:9, z:-3}, {n:"point", x:24, z:2}, {n:"extra cover", x:24, z:30}, {n:"straight hit", x:0, z:72}, {n:"mid-on", x:-11, z:32}, {n:"cow corner", x:-42, z:52}, {n:"square leg", x:-25, z:-1}, {n:"deep fine leg", x:-38, z:-40}]
];
let FIELD = KEEP.concat(FIELDS[0]);
function setField(){ const n = I(); FIELD = KEEP.concat(FIELDS[(Math.floor(n.balls / 6) + G.cur) % FIELDS.length]); }
const fieldAng = f => Math.atan2(f.x, f.z - CONTACT) * 180 / Math.PI;
/* Smallest angle between the aimed direction and a fielder: big means a gap */
function gapAt(ang){ let m = 180; FIELD.forEach((f, i) => { if(i > 1) m = Math.min(m, Math.abs(angDiff(fieldAng(f), ang))); }); return m; }
const CENTRE = 10, ROPE = 64;

let G = null, menuOpen = false, rulesOpen = false, setupPlayers = null, opts = {overs:2, wickets:3};
let talk = true, best = {};
let A = null; /* animation state for the current ball, never saved */

/* ---------- Voice, sound and saving ---------- */
const TTS = typeof speechSynthesis !== "undefined"; let voice = null;
function pickVoice(){ if(!TTS) return; const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^en[-_]US/i.test(v.lang) && /natural|enhanced|premium|online/i.test(v.name)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if(TTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t){ if(!TTS || !talk || typeof SpeechSynthesisUtterance === "undefined") return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); if(voice){ u.voice = voice; u.lang = voice.lang; } u.rate = 1; speechSynthesis.speak(u); }catch(e){} }
let AC = null;
function audio(){ if(AC) return AC; try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} return AC; }
function noise(dur, freq, q, gain, attack){ const ac = audio(); if(!ac) return; try{
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0); for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); src.buffer = buf; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
  const t = ac.currentTime; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start(); }catch(e){} }
const sfx = {
  bat(q){ noise(.12, 1800, 1.2, .5 + .4 * q, .003); noise(.06, 3800, 2, .25, .002); },
  cheer(big){ noise(big ? 2.2 : 1.4, 900, .5, big ? .35 : .22, .35); },
  stumps(){ noise(.25, 700, 3, .5, .004); noise(.18, 1300, 4, .3, .004); },
  groan(){ noise(1, 400, .7, .12, .2); }
};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({G, talk, best, opts})); }catch(e){} }
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d){ talk = d.talk !== false; best = d.best || {}; if(d.opts){ opts = d.opts; if(opts.aim !== undefined) aimSel = opts.aim; } if(d.G && d.G.v === 1) G = d.G; } }catch(e){} }
function rallyPlayers(){

  return `<div class="cover"><p style="margin:0;font-size:1.1rem;opacity:.9">${G.cur === 0 ? "First up" : "Next to bat"}</p><h2>${esc(p.name)}</h2>
    <p style="margin:0;font-size:1.05rem;max-width:30em">${G.overs} ${G.overs === 1 ? "over" : "overs"}, ${G.wickets} wickets · ${LEVELS[p.level].name}${top !== null ? `<br>Target: beat ${esc(G.players[top].name)}'s ${G.inn[top].runs}` : ""}</p>
    <button class="btn" style="background:#fff;color:#0b2d4f;font-size:1.25rem;min-height:68px;padding-inline:30px" data-a="bat">I'm ${esc(p.name)}. Start batting</button></div>`; }
function panelHTML(){
  const p = P(), n = I(), top = topSoFar(), left = ballsTotal() - n.balls;
  const need = top !== null ? G.inn[top].runs + 1 - n.runs : null;
  const thisOver = n.balls6.slice(n.overStart || 0), legal = thisOver.filter(x => x !== "Wd").length;
  return `<div class="card turn"><div class="scoreline"><div><h2>${esc(p.name)}</h2><p>${LEVELS[p.level].name} · ${oversText(n.balls)} of ${G.overs} ${G.overs === 1 ? "over" : "overs"}</p></div>
      <div class="big">${n.runs}<span>/${n.wk}</span></div></div></div>
    ${need !== null ? `<div class="card target"><b>${need > 0 ? `Needs ${need} from ${left} ${left === 1 ? "ball" : "balls"}` : `In the lead!`}</b><span class="sub">${esc(G.players[top].name)} scored ${G.inn[top].runs}</span></div>` : ""}
    <div class="card"><h3>This over</h3><div class="balls">${thisOver.map(x => `<span class="bl ${x === "W" ? "w" : x === "4" || x === "6" ? "b" : x === "Wd" ? "x" : ""}">${x === "0" ? "•" : x}</span>`).join("")}${Array.from({length:Math.max(0, 6 - legal)}, () => `<span class="bl e"></span>`).join("")}</div>
      <p class="sub" id="last">${A && A.result ? esc(A.result.line) + (A.result.where ? `<br><b>${esc(A.result.where)}</b>` : "") : "Tap the screen when the ball is inside the green HIT box. Use Left, Straight or Right to choose where the ball goes."}</p></div>
    <div class="card"><h3>Scorecard</h3><div class="srow"><span>Fours</span><b>${n.fours}</b></div><div class="srow"><span>Sixes</span><b>${n.sixes}</b></div><div class="srow"><span>Strike rate</span><b>${n.balls ? Math.round(n.runs * 100 / n.balls) : 0}</b></div>
      ${G.players.length > 1 ? `<div class="srow"><span>Batting order</span><b>${G.players.map((q, i) => i === G.cur ? `<u>${esc(q.name)}</u>` : G.inn[i].done ? esc(q.name) + " " + G.inn[i].runs : esc(q.name)).join(" · ")}</b></div>` : ""}</div>`;
}
function innEndScreen(){ const p = P(), n = I(), next = G.cur + 1 < G.players.length ? G.players[G.cur + 1] : null;
  return `<div class="setup"><div class="card turn"><h2>${esc(p.name)}: ${n.runs}${n.wk < G.wickets ? "*" : ""}</h2><p>${n.balls} balls · ${n.fours} fours · ${n.sixes} sixes · ${n.wk} out</p></div>
    ${best[p.name] && best[p.name].runs === n.runs && best[p.name].fresh ? `<div class="card target"><b>New best score for ${esc(p.name)}!</b></div>` : ""}
    <button class="btn go" data-a="next">${next ? "Next batter: " + esc(next.name) : "See the result"}</button></div>`; }
function overScreen(){
  if(!G.sent && !G.tried && G.players.length > 1){ G.tried = true; if(sendToRally()){ G.sent = true; } save(); }
  const r = ranking();
  return `<div class="setup"><div class="card turn"><h2>${G.players.length > 1 ? esc(G.players[r[0]].name) + " wins!" : "Innings over"}</h2><p>${G.overs} ${G.overs === 1 ? "over" : "overs"} each</p></div>
    <div class="card"><h3>Final scores</h3>${r.map((i, k) => `<div class="srow"><span>${G.players.length > 1 ? k + 1 + ". " : ""}${esc(G.players[i].name)}</span><b>${G.inn[i].runs}/${G.inn[i].wk} <small class="sub">(${G.inn[i].balls})</small></b></div>`).join("")}</div>
    ${G.sent ? `<div class="card target"><b>Added to the scoreboard</b><span class="sub">${esc((G.got || []).join(", "))}</span></div>` : G.players.length > 1 ? `<button class="btn amber" data-a="rally">Add points to the scoreboard (25 for 1st, 10 for 2nd)</button>` : ""}
    <button class="btn go" data-a="again">Play again with the same batters</button><button class="btn" data-a="menu">Change players</button></div>`;
}
function render(){
  $("#talkBtn").textContent = talk ? "Voice on" : "Voice off";
  const app = $("#app");
  if(menuOpen || !G){ app.innerHTML = setupScreen(); stopLoop(); }
  else if(G.phase === "cover"){ app.innerHTML = coverScreen(); stopLoop(); }
  else if(G.phase === "innEnd"){ app.innerHTML = innEndScreen(); stopLoop(); }
  else if(G.phase === "over"){ app.innerHTML = overScreen(); stopLoop(); }
  else { if(!$("#pitch")) app.innerHTML = `<main class="play"><div class="stage" id="stage"><canvas id="pitch" aria-label="Cricket pitch. Tap to swing the bat."></canvas><div class="aimbar" role="group" aria-label="Shot direction">${[["-1","◀ Left"],["0","▲ Straight"],["1","Right ▶"]].map(([v, l]) => `<button data-aim="${v}" class="${String(aimSel) === v ? "on" : ""}">${l}</button>`).join("")}</div></div><div class="panel" id="panel"></div></main>${rulesOpen ? `<div class="rulesbox">${RULES}<button class="btn" data-a="rules">Close the rules</button></div>` : ""}`;
    else { const rb = $(".rulesbox"); if(rulesOpen && !rb) app.insertAdjacentHTML("beforeend", `<div class="rulesbox">${RULES}<button class="btn" data-a="rules">Close the rules</button></div>`); if(!rulesOpen && rb) rb.remove(); }
    renderPanel(); startLoop(); }
  save();
}
function renderPanel(){ const p = $("#panel"); if(p && G && G.phase === "bat") p.innerHTML = panelHTML(); }
function startLoop(){ if(!raf) loop(); }
function stopLoop(){ if(raf){ cancelAnimationFrame(raf); raf = 0; } }
let toastT; function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1700); }

function endInnings(){ const p = P(), n = I(); const b = best[p.name];
  if(!b || n.runs > b.runs){ best[p.name] = {runs:n.runs, notout:n.wk < G.wickets, level:p.level, fresh:true}; } else { b.fresh = false; b.level = p.level; } }

/* ---------- Input ---------- */
if(typeof document !== "undefined" && document.addEventListener){
/* Direction buttons pick where to hit; a tap anywhere else on the pitch swings the bat */
function setAim(v){ aimSel = v; opts.aim = v; document.querySelectorAll(".aimbar button").forEach(b => b.classList.toggle("on", +b.dataset.aim === v)); save(); }
document.addEventListener("pointerdown", e => { const st = e.target.closest && e.target.closest("#stage"); if(!st) return; e.preventDefault(); audio();
  const ab = e.target.closest("[data-aim]"); if(ab){ setAim(+ab.dataset.aim); return; }
  const r = st.getBoundingClientRect(); if(A && A.swing === null) A.tap = {x:e.clientX - r.left, y:e.clientY - r.top, t:now()}; swing(AIMS[aimSel]); }, {passive:false});
document.addEventListener("keydown", e => { if(!G || G.phase !== "bat" || menuOpen) return;
  const a = {ArrowLeft:-1, ArrowRight:1, ArrowUp:0}[e.code]; if(a !== undefined){ e.preventDefault(); setAim(a); return; }
  if(e.code === "Space" || e.key === "Enter"){ e.preventDefault(); swing(AIMS[aimSel]); } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if(!b || b.disabled) return;
  switch(b.dataset.a){
    case "rules": rulesOpen = !rulesOpen; break;
    case "talk": talk = !talk; if(!talk && TTS) speechSynthesis.cancel(); break;
    case "menu": menuOpen = true; setupPlayers = null; A = null; break;
    case "resume": menuOpen = false; if(G.phase === "bat") A = null; break;
    case "lvl": setupPlayers[+b.dataset.i].level = b.dataset.l; break;
    case "ovr": opts.overs = +b.dataset.v; break;
    case "wkt": opts.wickets = +b.dataset.v; break;
    case "start": { const ps = setupPlayers.filter(p => p.on); if(!ps.length) break; audio(); newGame(ps); menuOpen = false; A = null; say(ps[0].name + " is first in to bat."); break; }
    case "again": { const ps = G.players.map(p => ({...p})); newGame(ps); A = null; break; }
    case "bat": audio(); G.phase = "bat"; A = null; render(); say(P().name + " to bat. Tap when the ball reaches you."); startBall(1200); return;
    case "next": endInnings(); if(G.cur + 1 < G.players.length){ G.cur++; G.phase = "cover"; } else { G.phase = "over"; const r = ranking(); if(G.players.length > 1) say(G.players[r[0]].name + " wins with " + G.inn[r[0]].runs + "!"); } break;
    case "rally": if(sendToRally()){ G.sent = true; toast("Points added to the scoreboard"); } else toast("Open the games home screen once on this device first"); break;
    default: return;
  }
  render();
});
document.addEventListener("change", e => { const t = e.target; if(t.classList.contains("pon")){ setupPlayers[+t.dataset.i].on = t.checked; render(); } });
window.addEventListener("resize", () => draw());
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden" && A && A.state !== "result"){ A = null; } else if(document.visibilityState === "visible" && G && G.phase === "bat" && !A && !menuOpen){ startBall(800); } });
load(); if(!G) menuOpen = true;
if(G && G.phase === "bat" && !menuOpen){ render(); startBall(1200); } else render();
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
