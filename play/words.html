<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Word Builder</title>

<style>
/* Layout: letter tiles and buttons on the left, found words on the right on tablets; one column on phones. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#eaf4fa; --ink:#14202b; --muted:#526a7d; --line:#d3e3ee;
  --pine:#0b5394; --pine-ink:#ffffff; --sky:#1a98cb; --cap:#f7a61b; --cap-ink:#14202b; --bad:#b0422d; --good:#1d7a4b;
  --red:#d83a3a; --green:#2e9e4f; --yellow:#f2b705; --blue:#1f6fd1;
  --display:"Montserrat","Open Sans",system-ui,sans-serif; --body:"Poppins","Open Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0b1726; --surface:#12233a; --surface-2:#1a3150; --ink:#eaf2f8; --muted:#9fb4c6; --line:#244263; --pine:#3aaee0; --pine-ink:#04121f; color-scheme:dark; }}
:root[data-theme="dark"]{ --bg:#0b1726; --surface:#12233a; --surface-2:#1a3150; --ink:#eaf2f8; --muted:#9fb4c6; --line:#244263; --pine:#3aaee0; --pine-ink:#04121f; color-scheme:dark; }
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit} button{cursor:pointer}
:focus-visible{outline:3px solid var(--cap);outline-offset:2px}
[hidden]{display:none!important}
header{background:#0b5394;color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0;flex:1}
.hbtn{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;text-decoration:none;font-size:.88rem}
.hbtn.back{background:#fff;color:#0b5394;font-weight:800}
.logo{background:#fff;border-radius:8px;padding:3px 6px;line-height:0} .logo img{height:28px;width:auto;display:block}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1200px;margin:0 auto}
@media (max-width: 860px){ main{grid-template-columns:1fr} }
#board{width:100%;max-width:min(100%, calc(100vh - 110px));aspect-ratio:1;display:block;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.turn{background:var(--pc);color:#fff;border:0} .turn.light{color:#14202b}
.turn h2{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;line-height:1.1} .turn p{margin:0}
h3{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0}
.sub{color:var(--muted);margin:0;font-size:.92rem}
.btn{border:0;border-radius:12px;padding:12px 14px;min-height:52px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.go{background:var(--pine);color:var(--pine-ink)} .btn.amber{background:var(--cap);color:var(--cap-ink)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap} .row .btn{flex:1 1 0}
.dicewrap{display:flex;align-items:center;gap:14px}
.diebtn{border:0;background:none;padding:0;border-radius:18px;flex:none;touch-action:manipulation} .diebtn:disabled{cursor:default}
.rollbtn{min-height:76px;font-size:1.35rem;touch-action:manipulation}
.oneline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rollhit{cursor:pointer}
html{touch-action:manipulation}
.turn p{min-height:2.9em}
.die{width:72px;height:72px;border-radius:16px;background:#fff;border:3px solid #0b5394;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:9px;flex:none}
.die i{width:12px;height:12px;border-radius:50%;background:#14202b;place-self:center;visibility:hidden}
.die.rolling{animation:shake .5s ease}
@keyframes shake{25%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}75%{transform:rotate(-6deg)}}
.seats{display:grid;gap:8px}
.seat{display:flex;align-items:center;gap:10px;font-weight:600}
.seat .dot{width:16px;height:16px;border-radius:50%;background:var(--pc);flex:none}
.seat .home{margin-left:auto;font-family:var(--display);font-weight:800}
.setup{max-width:640px;margin:20px auto;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.setup h2{font-family:var(--display);font-weight:800;font-size:1.8rem;margin:0}
.pl{display:flex;align-items:center;gap:10px} .pl input[type=checkbox]{width:28px;height:28px;accent-color:#0b5394}
.ivy{font-size:.85rem;color:var(--muted)} .ivy a{color:var(--pine);font-weight:700}
.tok{cursor:pointer} .tok.can{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:translateY(-.12px) scale(1.12)}}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* Word Builder */
main.wb{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;max-width:1100px}
@media (max-width: 860px){ main.wb{grid-template-columns:1fr} }
.turn{background:#0b5394;color:#fff}
.scoreline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.big small{display:block;font-family:var(--body);font-size:.75rem;font-weight:600;opacity:.85;letter-spacing:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;min-height:40px;color:var(--ink);touch-action:manipulation}
.seg button.on{background:var(--grad-go,#0b5394);color:#fff;box-shadow:0 4px 10px -4px rgba(11,83,148,.6)}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.srow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.srow:last-child{border-bottom:0} .srow b{text-align:right}
.cover{position:fixed;inset:0;z-index:20;background:var(--grad,#0b5394);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.cover h2{font-family:var(--display);font-weight:800;font-size:3.2rem;margin:0;line-height:1;letter-spacing:-.03em;overflow-wrap:anywhere}
.rulesbox{position:fixed;inset:auto 0 0 0;z-index:15;max-height:70vh;overflow:auto;background:var(--surface);padding:16px;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.target{border:1.5px solid var(--cap)!important;gap:2px}
.timer{display:flex;align-items:center;gap:10px}
.tbar{flex:1;height:14px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .25s linear}
.tbar i.low{background:var(--cap)}
.secs{font-family:var(--display);font-weight:800;font-size:1.25rem;min-width:3.4em;text-align:right;font-variant-numeric:tabular-nums}
.now{margin:0;font-weight:600;text-align:center;font-size:1.02rem}
.built{min-height:76px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;border-radius:16px;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line);padding:8px;
  border:0;width:100%;touch-action:manipulation;transition:background-color .2s,box-shadow .2s}
.built .ph{color:var(--muted);font-weight:500;font-size:.95rem}
.built .bt{width:46px;height:54px;border-radius:12px;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.7rem;text-transform:uppercase;box-shadow:inset 0 0 0 2px var(--sky)}
.built .bt.last{box-shadow:inset 0 0 0 2.5px var(--cap)}
.built.ok{background:rgba(29,122,75,.16);box-shadow:inset 0 0 0 2.5px var(--good)}
.built.no{animation:nudge .35s ease}
@keyframes nudge{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;padding:4px 0}
.tile{width:clamp(56px,18vw,84px);height:clamp(56px,18vw,84px);border:0;border-radius:18px;background:var(--grad-go);color:#fff;font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,8vw,2.5rem);
  text-transform:uppercase;box-shadow:var(--sh-go);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .1s,opacity .15s}
.tile:active:not(:disabled){transform:scale(.94)}
.tile:disabled{opacity:.22;box-shadow:none;cursor:default}
.fb{min-height:1.6em;margin:0;text-align:center;font-weight:700;font-size:1.05rem}
.fb.good{color:var(--good)} .fb.info{color:var(--muted)}
.enter{min-height:66px;font-size:1.35rem;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap} .row .btn{flex:1 1 0}
.grp{display:flex;flex-direction:column;gap:6px}
.grp h4{margin:0;font-size:.85rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.95rem;box-shadow:inset 0 0 0 1px var(--line)}
.chip.new{background:rgba(29,122,75,.16);box-shadow:inset 0 0 0 1.5px var(--good)}
.chip.miss{background:transparent;box-shadow:inset 0 0 0 1.5px dashed var(--line);border:1.5px dashed var(--sky)}
.done{min-height:52px}
.letters{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.letters span{width:40px;height:44px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){ .built.no{animation:none} }

/* ===== Visual refresh (styling only; layout and behaviour unchanged) ===== */
:root{
  --bg:#f3f7fb; --surface:#ffffff; --surface-2:#edf4fa; --line:#dde8f1;
  --display:"Montserrat","Open Sans",system-ui,sans-serif; --body:"Poppins","Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --grad:linear-gradient(135deg,#0b5394 0%,#11679f 55%,#1a98cb 100%);
  --grad-go:linear-gradient(180deg,#1478b5 0%,#0b5394 100%);
  --grad-amber:linear-gradient(180deg,#ffbd45 0%,#f7a61b 100%);
  --ring:0 0 0 4px rgba(26,152,203,.22);
  --sh-1:0 1px 2px rgba(13,42,64,.05),0 1px 3px rgba(13,42,64,.05);
  --sh-2:0 1px 2px rgba(13,42,64,.04),0 8px 24px -6px rgba(13,42,64,.12);
  --sh-3:0 18px 40px -12px rgba(11,83,148,.35);
  --sh-go:0 8px 18px -8px rgba(11,83,148,.7);
  --sh-amber:0 8px 18px -8px rgba(214,128,0,.75);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08121f; --surface:#101e31; --surface-2:#172a43; --line:#22395a;
  --grad:linear-gradient(135deg,#0a3f73 0%,#0e5a92 60%,#147fb0 100%);
  --grad-go:linear-gradient(180deg,#5cc3ec 0%,#3aaee0 100%);
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6);
  --sh-3:0 18px 40px -14px rgba(0,0,0,.7); --sh-go:0 8px 18px -8px rgba(58,174,224,.55); }}
:root[data-theme="dark"]{
  --bg:#08121f; --surface:#101e31; --surface-2:#172a43; --line:#22395a;
  --grad:linear-gradient(135deg,#0a3f73 0%,#0e5a92 60%,#147fb0 100%);
  --grad-go:linear-gradient(180deg,#5cc3ec 0%,#3aaee0 100%);
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 1px 2px rgba(0,0,0,.3),0 10px 26px -10px rgba(0,0,0,.6);
  --sh-3:0 18px 40px -14px rgba(0,0,0,.7); --sh-go:0 8px 18px -8px rgba(58,174,224,.55); }

html{background-color:var(--bg)}
body{background:radial-gradient(900px 420px at 85% -120px,rgba(26,152,203,.12),transparent 70%) no-repeat,var(--bg);min-height:100vh;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
h1,h2,h3{letter-spacing:-.015em}
:focus-visible{outline:none;box-shadow:var(--ring),0 0 0 2px var(--sky)!important}

/* Header bar */
header{background:var(--grad);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 6px 20px -10px rgba(11,83,148,.6);position:relative;z-index:2}
header h1{letter-spacing:-.02em}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);border-radius:999px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .18s var(--ease),transform .12s var(--ease)}
.hbtn:hover{background:rgba(255,255,255,.22)}
.hbtn:active{transform:scale(.96)}
.hbtn.back{background:#fff;color:#0b5394;border-color:#fff;box-shadow:0 4px 12px -4px rgba(0,0,0,.35)}
.hbtn.back:hover{background:#f1f7fc}
.logo{border-radius:10px;box-shadow:0 4px 12px -4px rgba(0,0,0,.3)}

/* Surfaces */
.card{border-color:var(--line);border-radius:18px;box-shadow:var(--sh-2)}
.turn{background-image:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,0) 55%,rgba(0,0,0,.1));box-shadow:var(--sh-3);border-radius:18px}
.sub{line-height:1.5}

/* Buttons */
.btn{border-radius:14px;letter-spacing:.005em;box-shadow:inset 0 0 0 1px var(--line);
  transition:transform .12s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease),background-color .2s var(--ease)}
.btn:hover:not(:disabled){filter:brightness(1.03);box-shadow:inset 0 0 0 1px var(--line),var(--sh-1)}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.go{background:var(--grad-go);box-shadow:var(--sh-go)}
.btn.go:hover:not(:disabled){box-shadow:var(--sh-go);filter:brightness(1.07)}
.btn.amber{background:var(--grad-amber);box-shadow:var(--sh-amber),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.amber:hover:not(:disabled){box-shadow:var(--sh-amber),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.bad{box-shadow:none}
.btn:disabled{opacity:.5;filter:saturate(.6)}
.btn.go:disabled,.btn.amber:disabled{box-shadow:none}
.panel{padding-inline:6px;margin-inline:-6px}

/* Forms */
input[type=text],input[type=number],input:not([type]),select{border-radius:12px!important;border-color:var(--line)!important;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,input:not([type]):focus,select:focus{outline:none;border-color:var(--sky)!important;box-shadow:var(--ring)}
input[type=checkbox]{accent-color:var(--sky)!important}

/* Toast */
.toast{background:rgba(13,42,64,.92);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 14px 34px -10px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.1)}

/* Setup screens */
.setup h2{letter-spacing:-.025em}
.pl{border-radius:12px}
.ivy a{text-decoration:none;border-bottom:1.5px solid currentColor}
/* ===== end visual refresh ===== */
</style>
</head>

const LEVELS = {junior:{name:"Junior", n:5, secs:120, need:6}, standard:{name:"Standard", n:7, secs:90, need:10}};
const PTS = {3:1, 4:2, 5:4, 6:7, 7:12}, FULL = 5;
const wordPoints = (w, n) => (PTS[w.length] || 0) + (w.length === n ? FULL : 0);

let G = null, menuOpen = false, rulesOpen = false, setupPlayers = null, opts = {rounds:2};
let talk = true, levelOf = {};

/* ---------- Letter sets ---------- */
function counts(s){ const c = {}; for(const ch of s) c[ch] = (c[ch] || 0) + 1; return c; }
function fits(w, c){ const d = {}; for(const ch of w){ d[ch] = (d[ch] || 0) + 1; if(d[ch] > (c[ch] || 0)) return false; } return true; }
function shuffled(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
/* Pick a seed word, shuffle its letters, and list every word those letters make.
   A set is only used when it makes at least the minimum number of common words. */
function makeSet(level, used){
  const lv = LEVELS[level], list = SEEDS[level];
  for(let t = 0; t < 400; t++){
    const seed = list[Math.floor(Math.random() * list.length)];
    if(used && used.includes(seed) && t < 200) continue;
    const c = counts(seed), all = DICT.filter(w => w.length >= 3 && w.length <= lv.n && fits(w, c));
    const common = all.filter(w => RANK.get(w) < COMMON_N).length;
    if(common < lv.need) continue;
    let letters = shuffled(seed.split("")); for(let k = 0; k < 5 && letters.join("") === seed; k++) letters = shuffled(letters);
    return {seed, letters, all, common};
  }
  return null;
}

/* ---------- Voice and saving ---------- */
const TTS = typeof speechSynthesis !== "undefined"; let voice = null;
function pickVoice(){ if(!TTS) return; const vs = speechSynthesis.getVoices();
  voice = vs.find(v => /^en[-_]US/i.test(v.lang) && /natural|enhanced|premium|online/i.test(v.name)) || vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null; }
if(TTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(t){ if(!TTS || !talk || typeof SpeechSynthesisUtterance === "undefined") return; try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); if(voice){ u.voice = voice; u.lang = voice.lang; } u.rate = 1; speechSynthesis.speak(u); }catch(e){} }
let AC = null;
function audio(){ if(AC) return AC; try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} return AC; }
function beep(freq, dur, gain){ const ac = audio(); if(!ac) return; try{ const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = "sine"; o.frequency.value = freq; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02); }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({G, talk, levelOf, opts})); }catch(e){} }
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d){ talk = d.talk !== false; levelOf = d.levelOf || {}; if(d.opts) opts = d.opts; if(d.G && d.G.v === 1) G = d.G; } }catch(e){} }
function rallyPlayers(){
  try{ const d = JSON.parse(localStorage.getItem(RALLY_KEY)); if(d && d.players && d.players.length) return d.players.map(p => ({id:p.id, name:p.name})); }catch(e){}
  if(!PUBLIC) return [["mom","Mom"],["dad","Dad"],["kippi","Kippi"],["zubbu","Zubbu"]].map(([id, name]) => ({id, name}));
  return [1,2].map(i => ({id:"p" + i, name:"Player " + i}));
}
function sendToRally(){
  try{ const d = JSON.parse(localStorage.getItem(RALLY_KEY)); if(!d || !d.players || G.players.length < 2) return false;
    const pts = [25, 10], got = [];
    ranking().slice(0, 2).forEach((pi, k) => { const id = G.players[pi].id; if(!d.players.some(p => p.id === id)) return;
      d.today = d.today || {}; d.today[id] = (d.today[id] || 0) + pts[k]; d.log = d.log || []; d.log.push({id, pts:pts[k], label:"Word Builder place " + (k + 1)}); got.push(G.players[pi].name + " +" + pts[k]); });
    if(!got.length) return false;
    localStorage.setItem(RALLY_KEY, JSON.stringify(d)); G.got = got; return true; }catch(e){ return false; }
}

/* ---------- Game state ---------- */
function newGame(players){
  G = {v:1, players:players.map(p => ({id:p.id, name:p.name, level:p.level})), rounds:opts.rounds, r:0, cur:0, sets:[],
    tot:players.map(() => ({pts:0, words:0, best:""})), last:null, phase:"cover", turn:null, sent:false, tried:false};
  makeRound();
}
/* Every player at the same level gets the same letters in a round */
function makeRound(){
  const used = G.sets.flatMap(s => Object.values(s).map(x => x.seed)), s = {};
  ["junior", "standard"].forEach(l => { if(G.players.some(p => p.level === l)) s[l] = makeSet(l, used); });
  G.sets[G.r] = s;
}
const P = () => G.players[G.cur], LV = p => LEVELS[(p || P()).level], SET = () => G.sets[G.r][P().level];
const better = (a, b) => a.length !== b.length ? a.length > b.length : wordPoints(a, 7) > wordPoints(b, 7);
/* Ranking: most points; if level, the longer best word; if still level, more words found */
function ranking(){ return G.players.map((_, i) => i).sort((a, b) => G.tot[b].pts - G.tot[a].pts || G.tot[b].best.length - G.tot[a].best.length || G.tot[b].words - G.tot[a].words); }

/* ---------- One turn ---------- */
function startTurn(){
  const set = SET();
  G.turn = {order:set.letters.map((_, i) => i), built:[], found:[], pts:0, left:LV().secs, fb:null};
  G.phase = "play"; render(); say(P().name + ". Go!");
}
function tapTile(i){
  const t = G.turn; if(!t || t.built.includes(i) || t.left <= 0) return;
  t.built.push(i); t.fb = null; beep(520 + t.built.length * 40, .06, .08); renderPlay();
}
function backspace(){ const t = G.turn; if(!t || !t.built.length) return; t.built.pop(); t.fb = null; renderPlay(); }
function clearWord(){ const t = G.turn; if(!t) return; t.built = []; t.fb = null; renderPlay(); }
function shuffleTiles(){ const t = G.turn; if(!t) return; t.order = shuffled(t.order); renderPlay(); }
function submit(){
  const t = G.turn; if(!t || t.left <= 0) return;
  const set = SET(), w = t.built.map(i => set.letters[i]).join("");
  let fb;
  if(!w.length) fb = {k:"info", text:"Tap some letters first"};
  else if(w.length < 3) fb = {k:"info", text:"Too short. Use 3 or more letters"};
  else if(t.found.includes(w)) fb = {k:"info", text:"Already found: " + w.toUpperCase()};
  else if(!set.all.includes(w)) fb = {k:"info", text:"Not in our word list. Try another"};
  else { const pts = wordPoints(w, set.letters.length); t.found.push(w); t.pts += pts;
    fb = {k:"good", text:(w.length === set.letters.length ? "Full house! " : "") + w.toUpperCase() + " +" + pts + (pts === 1 ? " point" : " points"), w};
    beep(660, .09, .12); setTimeout(() => beep(880, .12, .12), 90); }
  if(fb.k !== "good") beep(220, .12, .06);
  t.fb = fb; t.built = []; save(); renderPlay(fb.k === "good" ? "ok" : "no");
}
function endTurn(){
  const t = G.turn, set = SET(), tot = G.tot[G.cur];
  tot.pts += t.pts; tot.words += t.found.length;
  const longest = t.found.reduce((b, w) => !b || better(w, b) ? w : b, "");
  if(longest && (!tot.best || better(longest, tot.best))) tot.best = longest;
  G.last = {found:t.found.slice(), pts:t.pts, longest, missed:missedWords(set, t.found, P().level)};
  G.turn = null; G.phase = "turnEnd"; save(); render();
  const n = t.found.length;
  say("Time is up. " + P().name + " found " + n + (n === 1 ? " word" : " words") + " for " + t.pts + (t.pts === 1 ? " point." : " points.") + (longest ? " Longest word: " + longest + "." : ""));
}
/* The longest common words this player did not find (juniors see easier ones first) */
function missedWords(set, found, level){
  let pool = set.all.filter(w => !found.includes(w) && RANK.get(w) < COMMON_N);
  if(level === "junior"){ const easy = pool.filter(w => RANK.get(w) < 2500); if(easy.length >= 5) pool = easy; }
  return pool.sort((a, b) => b.length - a.length || RANK.get(a) - RANK.get(b)).slice(0, 5);
}
function nextTurn(){
  G.cur++;
  if(G.cur >= G.players.length){ G.cur = 0; G.r++; if(G.r >= G.rounds){ G.phase = "over"; const r = ranking(); if(G.players.length > 1) say(G.players[r[0]].name + " wins with " + G.tot[r[0]].pts + " points!"); return; } makeRound(); }
  G.phase = "cover";
}

/* ---------- Timer ---------- */
let lastTick = 0;
function tick(){
  const t = performance.now(), dt = Math.min(1, (t - lastTick) / 1000); lastTick = t;
  if(!G || G.phase !== "play" || !G.turn || menuOpen || rulesOpen || document.visibilityState === "hidden") return;
  const before = Math.ceil(G.turn.left);
  G.turn.left = Math.max(0, G.turn.left - dt);
  const s = Math.ceil(G.turn.left);
  if(s !== before){ drawTimer(); if(s <= 5 && s > 0) beep(440, .05, .05); if(s % 5 === 0) save(); }
  if(G.turn.left <= 0) endTurn();
}
function drawTimer(){ const el = $("#tbar"), sc = $("#secs"); if(!el || !G.turn) return; const s = Math.ceil(G.turn.left), f = G.turn.left / LV().secs;
  el.style.width = (f * 100).toFixed(1) + "%"; el.classList.toggle("low", s <= 10); sc.textContent = s + " s"; }

/* ---------- Screens ---------- */
const RULES = `<div class="card"><h3>How to play</h3>

function setupScreen(){

}
function coverScreen(){ const p = P(), lv = LV();
  return `<div class="cover"><p style="margin:0;font-size:1.1rem;opacity:.9">Round ${G.r + 1} of ${G.rounds} · ${G.cur === 0 && G.r === 0 ? "First up" : "Pass the phone to"}</p><h2>${esc(p.name)}</h2>
    <p style="margin:0;font-size:1.05rem;max-width:30em">${lv.name}: ${lv.n} letters, ${lv.secs} seconds${G.r > 0 || G.cur > 0 ? `<br>Points so far: ${G.tot[G.cur].pts}` : ""}</p>
    <button class="btn" style="background:#fff;color:#0b2d4f;font-size:1.25rem;min-height:68px;padding-inline:30px" data-a="go">I'm ${esc(p.name)}. Start</button></div>`; }
function groups(words, cls){
  const by = {}; words.forEach(w => (by[w.length] = by[w.length] || []).push(w));
  return Object.keys(by).sort((a, b) => b - a).map(L => `<div class="grp"><h4>${L} letters</h4><div class="chips">${by[L].map(w => `<span class="chip ${cls ? cls(w) : ""}">${esc(w.toUpperCase())}</span>`).join("")}</div></div>`).join("");
}
function playHTML(anim){
  const p = P(), t = G.turn, set = SET(), lv = LV(), s = Math.ceil(t.left);
  const built = t.built.length ? t.built.map((i, k) => `<span class="bt ${k === t.built.length - 1 ? "last" : ""}">${esc(set.letters[i])}</span>`).join("") : `<span class="ph">Your word shows here</span>`;
  const fresh = t.fb && t.fb.w;
  return `<main class="wb"><div class="panel">
    <div class="card turn"><div class="scoreline"><div><h2>${esc(p.name)}</h2><p>Round ${G.r + 1} of ${G.rounds} · ${lv.name}</p></div><div class="big">${t.pts}<small>${t.pts === 1 ? "point" : "points"}</small></div></div></div>
    <div class="card">
      <div class="timer"><div class="tbar" aria-hidden="true"><i id="tbar" class="${s <= 10 ? "low" : ""}" style="width:${(t.left / lv.secs * 100).toFixed(1)}%"></i></div><span class="secs" id="secs">${s} s</span></div>
      <p class="now">${t.built.length ? "Press Enter when your word is ready" : "Tap letters to make a word"}</p>
      <button class="built ${anim || ""}" data-a="back" aria-label="Your word. Tap to remove the last letter.">${built}</button>
      <p class="fb ${t.fb ? t.fb.k : ""}" role="status">${t.fb ? esc(t.fb.text) : t.built.length ? "Tap your word to remove the last letter" : ""}</p>
      <div class="tiles">${t.order.map(i => `<button class="tile" data-a="tile" data-i="${i}" ${t.built.includes(i) ? "disabled" : ""} aria-label="Letter ${esc(set.letters[i].toUpperCase())}">${esc(set.letters[i])}</button>`).join("")}</div>
      <button class="btn go enter" data-a="enter">Enter</button>
      <div class="row"><button class="btn" data-a="clear">Clear</button><button class="btn" data-a="shuffle">Shuffle</button></div>
    </div></div>
    <div class="panel"><div class="card"><h3>Words found: ${t.found.length}</h3>${t.found.length ? groups(t.found, w => w === fresh ? "new" : "") : `<p class="sub">Your words will show here.</p>`}</div>
      <button class="btn done" data-a="done">${G.confirmDone ? "Tap again to end your turn" : "I'm done"}</button></div></main>
    ${rulesOpen ? `<div class="rulesbox">${RULES}<button class="btn" data-a="rules">Close the rules</button></div>` : ""}`;
}
function turnEndScreen(){ const p = P(), L = G.last, last = G.cur + 1 >= G.players.length && G.r + 1 >= G.rounds;
  const next = last ? null : G.cur + 1 < G.players.length ? G.players[G.cur + 1] : G.players[0];
  return `<div class="setup"><div class="card turn"><div class="scoreline"><div><h2>${esc(p.name)}</h2><p>Round ${G.r + 1} of ${G.rounds} · ${L.found.length} ${L.found.length === 1 ? "word" : "words"}</p></div><div class="big">${L.pts}<small>${L.pts === 1 ? "point" : "points"}</small></div></div></div>
    <div class="card"><h3>Your words</h3>${L.found.length ? groups(L.found) : `<p class="sub">No words this time. Try short words like the ones below.</p>`}${G.rounds > 1 ? `<p class="sub">Total so far: <b>${G.tot[G.cur].pts}</b></p>` : ""}</div>
    ${L.missed.length ? `<div class="card"><h3>Words you could have made</h3><div class="chips">${L.missed.map(w => `<span class="chip miss">${esc(w.toUpperCase())}</span>`).join("")}</div></div>` : ""}
    <button class="btn go" data-a="next">${next ? "Next: pass to " + esc(next.name) : "See the result"}</button></div>`; }
function overScreen(){
  if(!G.sent && !G.tried && G.players.length > 1){ G.tried = true; if(sendToRally()){ G.sent = true; } save(); }
  const r = ranking();
  return `<div class="setup"><div class="card turn"><h2>${G.players.length > 1 ? esc(G.players[r[0]].name) + " wins!" : "Game over"}</h2><p>${G.rounds} ${G.rounds === 1 ? "round" : "rounds"} played</p></div>
    <div class="card"><h3>Final scores</h3>${r.map((i, k) => `<div class="srow"><span>${G.players.length > 1 ? k + 1 + ". " : ""}${esc(G.players[i].name)} <small class="sub">${G.tot[i].words} words${G.tot[i].best ? ", best " + esc(G.tot[i].best.toUpperCase()) : ""}</small></span><b>${G.tot[i].pts}</b></div>`).join("")}
      <p class="sub">If points are level, the longer best word wins.</p></div>
    ${G.sent ? `<div class="card target"><b>Added to the scoreboard</b><span class="sub">${esc((G.got || []).join(", "))}</span></div>` : G.players.length > 1 ? `<button class="btn amber" data-a="rally">Add points to the scoreboard (25 for 1st, 10 for 2nd)</button>` : ""}
    <button class="btn go" data-a="again">Play again with the same players</button><button class="btn" data-a="menu">Change players</button></div>`;
}
function render(){
  $("#talkBtn").textContent = talk ? "Voice on" : "Voice off";
  const app = $("#app");
  if(menuOpen || !G) app.innerHTML = setupScreen();
  else if(G.phase === "cover") app.innerHTML = coverScreen();
  else if(G.phase === "play") app.innerHTML = playHTML();
  else if(G.phase === "turnEnd") app.innerHTML = turnEndScreen();
  else app.innerHTML = overScreen();
  if(!(menuOpen || !G) && G.phase !== "play" && rulesOpen) app.insertAdjacentHTML("beforeend", `<div class="rulesbox">${RULES}<button class="btn" data-a="rules">Close the rules</button></div>`);
  save();
}
function renderPlay(anim){ if(G && G.phase === "play" && !menuOpen) $("#app").innerHTML = playHTML(anim); }
let toastT; function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 1700); }

/* ---------- Input ---------- */
if(typeof document !== "undefined" && document.addEventListener){
document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if(!b || b.disabled) return;
  const a = b.dataset.a;
  if(a !== "done" && G) G.confirmDone = false;
  switch(a){
    case "tile": tapTile(+b.dataset.i); return;
    case "back": backspace(); return;
    case "enter": submit(); return;
    case "clear": clearWord(); return;
    case "shuffle": shuffleTiles(); return;
    case "done": if(G.confirmDone){ G.confirmDone = false; endTurn(); } else { G.confirmDone = true; renderPlay(); } return;
    case "rules": rulesOpen = !rulesOpen; break;
    case "talk": talk = !talk; if(!talk && TTS) speechSynthesis.cancel(); break;
    case "menu": menuOpen = true; setupPlayers = null; break;
    case "resume": menuOpen = false; break;
    case "lvl": setupPlayers[+b.dataset.i].level = b.dataset.l; levelOf[setupPlayers[+b.dataset.i].name] = b.dataset.l; break;
    case "rnd": opts.rounds = +b.dataset.v; break;
    case "start": { const ps = setupPlayers.filter(p => p.on); if(!ps.length) break; audio(); newGame(ps); menuOpen = false; break; }
    case "again": { const ps = G.players.map(p => ({...p})); newGame(ps); break; }
    case "go": audio(); startTurn(); return;
    case "next": nextTurn(); break;
    case "rally": if(sendToRally()){ G.sent = true; toast("Points added to the scoreboard"); } else toast("Open the games home screen once on this device first"); break;
    default: return;
  }
  render();
});
document.addEventListener("keydown", e => {
  if(!G || G.phase !== "play" || menuOpen || rulesOpen || !G.turn || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = G.turn, set = SET();
  if(e.key === "Enter"){ e.preventDefault(); submit(); return; }
  if(e.key === "Backspace"){ e.preventDefault(); backspace(); return; }
  if(e.key === "Escape"){ clearWord(); return; }
  if(/^[a-z]$/i.test(e.key)){ const k = e.key.toLowerCase(), i = t.order.find(j => set.letters[j] === k && !t.built.includes(j)); if(i !== undefined) tapTile(i); else { t.fb = {k:"info", text:"No " + k.toUpperCase() + " left to use"}; renderPlay(); } }
});
document.addEventListener("change", e => { const t = e.target; if(t.classList.contains("pon")){ setupPlayers[+t.dataset.i].on = t.checked; render(); } });
document.addEventListener("visibilitychange", () => { lastTick = performance.now(); if(document.visibilityState === "hidden") save(); });
lastTick = performance.now(); setInterval(tick, 200);
load(); if(!G) menuOpen = true;
render();
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
